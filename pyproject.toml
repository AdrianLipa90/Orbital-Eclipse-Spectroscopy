[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-eclipse-spectroscopy"
version = "0.2.0"
description = "Orbital Eclipse Spectroscopy reference implementation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
q1 = [
    "pyscf==2.14.0",
]

[tool.setuptools.packages.find]
include = ["oes*"]
