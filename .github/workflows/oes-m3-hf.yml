name: OES M3 HF 20Q

on:
  push:
    branches: [oes-m3-hf-20q, main]
  pull_request:

jobs:
  hf-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M3 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Run full regression and HF primitives
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run blind HF reduced-active fixed-20Q spectroscopy baseline
        run: python scripts/run_m3_hf_20q.py
