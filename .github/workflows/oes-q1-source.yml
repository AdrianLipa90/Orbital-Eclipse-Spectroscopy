name: OES Q1 source diagnostics

on:
  push:
  pull_request:

jobs:
  helium-source-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Diagnose aug versus geometric d-aug full source spectrum
        run: python scripts/run_q1_diffuse_source.py
      - name: Resolve d-aug first bright singlet manifold
        run: python scripts/run_q1_diffuse_manifold.py

  helium-daug-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Compress d-aug source to fixed 20Q and benchmark
        run: python scripts/run_q1_daug_20q.py
      - name: Hybrid radial plus bright d-aug compression at fixed 20Q
        run: python scripts/run_q1_daug_hybrid_20q.py
      - name: Symmetry-preserving s7+p3 d-aug compression at fixed 20Q
        run: python scripts/run_q1_daug_sp_20q.py
