name: OES Q1 source diagnostics

on:
  push:
  pull_request:

jobs:
  helium-source-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Diagnose aug versus geometric d-aug full source spectrum
        run: python scripts/run_q1_diffuse_source.py
      - name: Resolve d-aug first bright singlet manifold
        run: python scripts/run_q1_diffuse_manifold.py

  helium-daug-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Compress d-aug source to fixed 20Q and benchmark
        run: python scripts/run_q1_daug_20q.py
      - name: Hybrid radial plus bright d-aug compression at fixed 20Q
        run: python scripts/run_q1_daug_hybrid_20q.py
      - name: Symmetry-complete s4+p6 d-aug compression at fixed 20Q
        run: python scripts/run_q1_daug_s4p6_20q.py

  helium-daug-oracle-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Evaluate symmetry-aware d-aug oracle capacity at fixed 20Q
        run: python scripts/run_q1_daug_oracle_20q.py

  helium-daug-roas-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Evaluate ROAS-v1 operator-class selection at fixed 20Q
        run: python scripts/run_q1_daug_roas_20q.py

  helium-daug-roas-v2-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Evaluate ROAS-v2 minimal operator-family selection at fixed 20Q
        run: python scripts/run_q1_daug_roas_v2_20q.py
