name: OES A1 lithium 20Q

on:
  push:
    branches: [oes-a1-lithium-20q, main]
  pull_request:

jobs:
  lithium-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install A1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Run core regression and A1 dimension gates
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run neutral lithium fixed-20Q three-electron gate
        run: python scripts/run_a1_lithium_20q.py
