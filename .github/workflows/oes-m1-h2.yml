name: OES M1 H2 20Q

on:
  push:
    branches: [oes-m1-h2-20q, main]
  pull_request:

jobs:
  h2-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Run core regression and molecular primitive gates
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run H2 fixed-20Q two-centre baseline
        run: python scripts/run_m1_h2_20q.py
