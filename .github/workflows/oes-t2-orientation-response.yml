name: OES T2 orientation response

on:
  push:
    paths:
      - 'oes/subspace_tracking.py'
      - 'oes/orientation_response.py'
      - 'tests/test_subspace_tracking.py'
      - 'tests/test_orientation_response.py'
      - 'formalism/OES-T2-orientation-response.md'
      - '.github/workflows/oes-t2-orientation-response.yml'
  pull_request:
    paths:
      - 'oes/subspace_tracking.py'
      - 'oes/orientation_response.py'
      - 'tests/test_subspace_tracking.py'
      - 'tests/test_orientation_response.py'
      - 'formalism/OES-T2-orientation-response.md'
      - '.github/workflows/oes-t2-orientation-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orientation-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run OES T2 focused gate
        run: >
          python -m unittest -v
          tests.test_subspace_tracking
          tests.test_orientation_response
