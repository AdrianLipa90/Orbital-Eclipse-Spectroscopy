name: OES M4 HCl 20Q

on:
  push:
    branches: [oes-m4-hcl-20q]
  pull_request:

jobs:
  hcl-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M4 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Run generalized 20Q algebra and HCl primitive gates
        run: python -m unittest tests.test_sparse_ms tests.test_frozen_core tests.test_hcl_m4 -v
      - name: Run blind H35Cl eight-electron fixed-20Q spectroscopy baseline
        run: python scripts/run_m4_hcl_20q.py
