name: OES Q1 quantum helium

on:
  push:
  pull_request:

jobs:
  helium-20q:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Q1 dependencies
        run: python -m pip install -e '.[q1]'
      - name: Run Q1 core gates
        run: python -m unittest discover -s tests -p 'test_quantum_q1_core.py' -v
      - name: Run Q1 helium 20Q gate
        run: python -m unittest discover -s tests -p 'test_quantum_q1_helium.py' -v
      - name: Emit Q1 numerical receipt
        run: python scripts/run_q1_helium.py
      - name: Sweep fixed-20Q active spaces against He I 2s calibration levels
        run: python scripts/sweep_q1_active_space.py
      - name: Predict held-out first bright He I singlet line
        run: python scripts/run_q1_spectroscopy.py
      - name: Evaluate TAAS-v1 transition-aware compression at fixed 20Q
        run: python scripts/run_q1_taas.py
      - name: Evaluate TAAS-v2 operator-response natural orbitals at fixed 20Q
        run: python scripts/run_q1_taas_v2.py
      - name: Evaluate non-predictive oracle 20Q capacity upper bound
        run: python scripts/run_q1_oracle_capacity.py
